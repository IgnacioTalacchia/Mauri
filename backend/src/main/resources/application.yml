spring:
  application:
    name: verduleria-gestion
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mauri_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
---
spring:
  config:
    activate:
      on-profile: production
server:
  servlet:
    session:
      cookie:
        secure: true
